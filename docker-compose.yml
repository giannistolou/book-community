services:
    web:
        build: ./
        command: >
            sh -c "python3 manage.py collectstatic --noinput --clear &&
                   gunicorn bookCommunity.wsgi:application --bind 0.0.0.0:8000"
        volumes:
            - staticfiles:/home/app/web/staticfiles
            - uploadsfiles:/home/app/web/uploadsfiles
            - database:/home/app/web/database
        expose:
            - 8000
        environment:
            - ALLOWED_HOSTS=${ALLOWED_HOSTS:?}
            - DEBUG=${DEBUG:?}
            - SECRET_KEY=${SECRET_KEY:?}
            - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:?}
            - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY?:}
            - RESEND_API_KEY=${RESEND_API_KEY?:}
            - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
            - SENTRY_DSN=${SENTRY_DSN:-}
            - BOOK_CAFE_DOMAIN=${BOOK_CAFE_DOMAIN:-localhost}
            - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
            - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-0}
            - SECURE_HSTS_INCLUDE_SUBDOMAINS=${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
        depends_on:
            - static-init
        restart: always

    static-init:
      build: ./
      restart: "no"
      command: >
        sh -c "
          chown -R app:app /home/app/web/staticfiles &&
          chown -R app:app /home/app/web/uploadsfiles &&
          chown -R app:app /home/app/web/database
        "
      volumes:
        - staticfiles:/home/app/web/staticfiles
        - uploadsfiles:/home/app/web/uploadsfiles
        - database:/home/app/web/database
      user: root 
    nginx:
        build: ./nginx
        volumes:
            - staticfiles:/home/app/web/staticfiles
            - uploadsfiles:/home/app/web/uploadsfiles
        depends_on:
            - web
        restart: always
volumes:
    staticfiles:
        name: staticfilesBookCommunity
    uploadsfiles:
        name: uploadsfilesBookCommunity
    database:
        name: databaseBookCommunity