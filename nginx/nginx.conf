upstream django {
    server web:8000;
}

# Keep the scheme set by the TLS-terminating proxy in front of nginx
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {

    listen 80;
    server_tokens off;

    # Matches PROSE_ATTACHMENT_ALLOWED_FILE_SIZE (15 MB) with some headroom
    client_max_body_size 16m;

    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Names hashed by ManifestStaticFilesStorage change whenever the content does
    location ~ "^/static/(?<static_path>.+\.[0-9a-f]{12}\.[A-Za-z0-9]+)$" {
        alias /home/app/web/staticfiles/$static_path;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /static/ {
        alias /home/app/web/staticfiles/;
        expires 1d;
    }

    location /media/ {
        alias /home/app/web/uploadsfiles/;
        expires 30d;
    }

}
