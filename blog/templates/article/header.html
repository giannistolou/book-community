{% load static %}
<div class="articleHeader">
    <h1 class="title">
        {{ post.title }}
    </h1>
    <ul class="articleInfo">
        <li class="author">
            <a
                href="/author/{{ post.author.slug }}"
               
            >
                <img
                    src="{% if post.author.image_url %}{{ post.author.image_url }}{% else %}{% static 'favicons/android-chrome-192x192.png' %}{% endif %}"
                    alt="" class="author-avatar"
                    width="50"
                    height="50"
                    loading="lazy"
                    decoding="async"
                />
                <span>{{ post.author.name }}</span>
            </a>
        </li>
        <li>{% include "svg/date.html" %} {{ post.published_at|date:"d/m/Y" }}</li>
        <li>
            {% include "svg/category.html" %}
            <ul>
                <li>
                    <a href="/category/{{ post.category.slug }}">{{ post.category.name }}</a>
                </li>
            </ul>
        </li>
    </ul>
</div>
