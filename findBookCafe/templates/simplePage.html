<!DOCTYPE html>
<html lang="el">
	<head>
		{% load static seo %} {% load assets %} {% include "commonHead.html" %}
		<title>{{page_title}}</title>
		<link rel="canonical" href="{{ canonical_url }}" />
		{% inline_css 'style/cafes.css' %}
		<meta
			name="keywords"
			content="book, books, reading, βιβλίο, βιβλία, διάβασμα, social media, book cafe, cafe, καφετέριες, βιβλιοθήκη,
		βιβλιοθήκες, library, libraries"
		/>
		<meta property="og:url" content="{{ canonical_url }}" />
		<meta name="description" content="{{ content|meta_description }}" />
		<meta property="og:title" content="{{page_title}}" />
		<meta property="og:description" content="{{ content|meta_description }}" />
	</head>

	<body>
		{% include "header.html" %}
		<main >
			<div class="container">
				<h1 class="cafes-title">
					{{page_title}}
				</h1>
				<section class="content">
					{{content | safe}}
				</section>
			</div>
		</main>
		{% include "footer.html" %}
	</body>
</html>
